<!--
  Marktplaats Watcher · alert e-mail pattern (Sieve)
  Inline styles only for layout and light colours; the <style> block adds dark values where the client supports
  prefers-color-scheme. System fonts only. Max width 560px. Every text/fill pair is >= 4.5:1 in both schemes.
  Subject: "{watch}: {n} new match(es), best {score}/10 at €{price}"
  badge_kind / badge_bg / badge_ink:  score >= 8 great #157346 / #ffffff;  >= 6 good #ddd0ff / #25124f;  else neutral #eeebe6 / #5b5751
  Prices "€230" (no decimals, no space). Times 24-hour. No emoji, no exclamation marks.
-->
<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<style>
:root { color-scheme: light dark; supported-color-schemes: light dark; }
@media (prefers-color-scheme: dark) {
  .mw-page { background: #0f0e0d !important; }
  .mw-card { background: #1e1c1a !important; border-color: #34312d !important; }
  .mw-text { color: #ece9e4 !important; }
  .mw-text2 { color: #a9a49c !important; }
  .mw-link { color: #4fd1bf !important; }
  .mw-btn { background: #4fd1bf !important; color: #06201c !important; }
  .mw-great { background: #58d68e !important; color: #062414 !important; }
  .mw-good { background: #bca8ff !important; color: #190d3b !important; }
  .mw-neutral { background: #2b2926 !important; color: #a9a49c !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background:#f4f2ee;" class="mw-page">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="mw-page" style="background:#f4f2ee;">
<tr><td align="center" style="padding:24px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr><td style="padding:0 0 16px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 10px 0 0;"><img src="{{app_url}}/apple-touch-icon.png" width="28" height="28" alt="" style="display:block;border:0;border-radius:7px;"></td>
<td class="mw-text2" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;color:#5b5751;">Marktplaats <strong class="mw-text" style="color:#1b1a18;font-weight:600;">Watcher</strong></td>
</tr></table></td></tr>
<tr><td class="mw-card" style="background:#ffffff;border:1px solid #e4e0da;border-radius:12px;padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td style="padding:0 0 16px 0;">
<h1 class="mw-text" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:26px;font-weight:600;color:#1b1a18;letter-spacing:-0.2px;">{{watch_name}}</h1>
<div class="mw-text2" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#5b5751;margin:2px 0 0 0;">{{count_line}}</div>
</td></tr>
{{#listings}}
<tr><td style="padding:0 0 12px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="mw-card" style="border:1px solid #e4e0da;border-radius:10px;background:#ffffff;">
<tr><td width="48" valign="top" style="padding:16px 0 16px 16px;">
<div class="mw-{{badge_kind}}" style="width:48px;height:40px;line-height:40px;border-radius:8px;background:{{badge_bg}};color:{{badge_ink}};font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;font-weight:600;text-align:center;letter-spacing:-0.3px;">{{score}}/10</div>
</td><td valign="top" style="padding:14px 16px 16px 16px;">
<a href="{{url}}" class="mw-text" style="color:#1b1a18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:22px;font-weight:600;text-decoration:underline;text-decoration-color:#e4e0da;">{{title}}</a>
<div class="mw-text2" style="color:#5b5751;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;margin:4px 0 0 0;">Scored {{score}}/10, {{price}}, {{place}}</div>
<div class="mw-text" style="color:#1b1a18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;margin:4px 0 12px 0;">{{reason}}</div>
<a href="{{url}}" class="mw-btn" style="display:inline-block;background:#0d6b62;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;text-decoration:none;padding:8px 14px;border-radius:6px;">Open on Marktplaats</a>
</td></tr></table></td></tr>
{{/listings}}
</table></td></tr>
<tr><td style="padding:16px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5b5751;" class="mw-text2">
<a href="{{manage_url}}" class="mw-link" style="color:#0d6b62;text-decoration:underline;">Manage or pause this watch</a><br>
Replies to this address aren&rsquo;t read.<br>
Not affiliated with Marktplaats.
</td></tr>
</table></td></tr></table>
</body>
</html>
