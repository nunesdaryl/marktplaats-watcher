name: evals

on:
  push:
    branches: [main]
    paths:
      - agent.py
      - prompts.py
      - mcp_server.py
      - test_mcp.py
      - frontend/convex/embeddings.ts
      - evals/**
  pull_request:
    paths:
      - agent.py
      - prompts.py
      - mcp_server.py
      - test_mcp.py
      - frontend/convex/embeddings.ts
      - evals/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check eval key
        id: key
        env:
          EVAL_KEY: ${{ secrets.OPENAI_API_KEY_EVALS }}
        run: |
          if [ -z "$EVAL_KEY" ]; then
            echo "::notice::Evals skipped: OPENAI_API_KEY_EVALS is not set"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.available == 'true'
      - name: Install Python dependencies
        if: steps.key.outputs.available == 'true'
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Run chat and scorer evaluations
        if: steps.key.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_EVALS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
        run: |
          .venv/bin/python -m evals.run_chat
          .venv/bin/python -m evals.run_scorer --runs 3
      - name: Run RAG and MCP gate
        if: steps.key.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_EVALS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
        run: |
          .venv/bin/python -m pytest -q test_mcp.py
          if [ -f evals/data/rag_snapshot/snapshot.json ] && [ -f evals/data/rag_snapshot/cases.json ]; then
            .venv/bin/python -m evals.run_rag
          else
            echo "RAG eval skipped: no reviewed snapshot yet (see evals/data/rag_snapshot/README.md)"
          fi
      - name: Write evaluation report
        if: steps.key.outputs.available == 'true' && always()
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
        run: .venv/bin/python -m evals.report
      - name: Check evaluation gate
        if: steps.key.outputs.available == 'true'
        run: .venv/bin/python -m evals.gate
      - name: Upload evaluation report
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: |
            evals/report.md
            evals/data/*results.json
            evals/data/rag_results.json
