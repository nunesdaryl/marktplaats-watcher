name: marktplaats-canary
# A daily, read-only search shape check. A failed run notifies the owner through GitHub.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Check live search response
        run: .venv/bin/python marktplaats_canary.py
